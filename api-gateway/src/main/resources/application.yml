server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - name: CircuitBreaker
          args:
            name: gatewayRoutes
            fallbackUri: forward:/fallback
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/auth/**,/api/users/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100
        - id: patient-service
          uri: lb://patient-service
          predicates:
            - Path=/api/patients/**
        - id: doctor-service
          uri: lb://doctor-service
          predicates:
            - Path=/api/doctors/**,/api/specializations/**
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/api/appointments/**,/api/dashboard/**
        - id: emr-service
          uri: lb://emr-service
          predicates:
            - Path=/api/encounters/**,/api/prescriptions/**,/api/lab-orders/**,/api/lab-reports/**,/api/medicines/**,/api/lab-tests/**,/api/emr/**
        - id: billing-service
          uri: lb://billing-service
          predicates:
            - Path=/api/invoices/**,/api/payments/**,/api/insurance/**,/api/claims/**,/api/billing/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:healthcare-emr-ecosystem-jwt-signing-key-2026-development-only-0123456789abcdef}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.healthcare: INFO
    org.springframework.cloud.gateway: INFO
